<ui:composition template="/template/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">Inscription - E-Commerce JSF &amp; JPA</ui:define>

    <ui:define name="content">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow-sm border-0 mt-3">
                    <div class="card-header bg-success text-white text-center py-3">
                        <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill me-2"></i>Inscription Internaute</h4>
                        <small>Rejoignez notre plateforme e-commerce en quelques secondes</small>
                    </div>
                    <div class="card-body p-4">
                        <h:form id="registerForm">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Nom</label>
                                    <h:inputText value="#{internauteBean.nom}" class="form-control" required="true"
                                                 requiredMessage="Le nom est obligatoire" />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Prénom</label>
                                    <h:inputText value="#{internauteBean.prenom}" class="form-control" required="true"
                                                 requiredMessage="Le prénom est obligatoire" />
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Adresse Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <h:inputText value="#{internauteBean.email}" class="form-control" required="true"
                                                 requiredMessage="L'email est obligatoire" />
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mot de passe</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <h:inputSecret value="#{internauteBean.motDePasse}" class="form-control" required="true"
                                                   requiredMessage="Le mot de passe est obligatoire" />
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Adresse postale de livraison</label>
                                <h:inputTextarea value="#{internauteBean.adresse}" class="form-control" rows="2" />
                            </div>

                            <div class="d-grid mb-3">
                                <h:commandButton action="#{internauteBean.inscrire}" value="Valider l'inscription"
                                                 class="btn btn-success py-2 fw-semibold" />
                            </div>

                            <div class="text-center text-muted">
                                Déjà inscrit ?
                                <h:link outcome="login.xhtml" class="text-decoration-none fw-bold ms-1">Se connecter</h:link>
                            </div>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>
